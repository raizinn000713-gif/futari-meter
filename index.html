.character-preview{display:flex;align-items:center;justify-content:center;gap:12px;background:#fff7fb;border:1px solid #f6dce9;border-radius:14px;padding:4px 10px;margin:7px 0 12px;color:#a66a8b;font-size:12px}.character-preview img{width:94px;height:94px;object-fit:contain} </style></head><body><main class="app" id="app"><header class="top"><button class="hamb" id="menu">☰</button><div class="brand">Futari Meter ♡</div><div class="sub">－ ふたりメーター －</div><div class="day" id="days"></div><button class="bell" id="bell">♡</button></header><div class="room" id="roomline"></div><section id="home"></section><section id="calendarPage" class="hidden"></section><section id="recordsPage" class="hidden"></section><section id="settingsPage" class="hidden"></section></main><nav class="nav" id="nav"><button data-page="home" class="active"><span class="ico">⌂</span>ホーム</button><button data-page="calendarPage"><span class="ico">▦</span>カレンダー</button><button data-page="recordsPage"><span class="ico">♡</span>きろく</button><button data-page="settingsPage"><span class="ico">⚙</span>設定</button></nav><div id="modal" class="overlay hidden"><div class="dialog" id="dialog"></div></div><div id="toast" class="toast hidden"></div>
<script type="module">
// Firebase 設定: Firebase コンソールの「プロジェクトの設定 → マイアプリ」からコピーしてください。
const firebaseConfig = {apiKey:'',authDomain:'',databaseURL:'https://futari-meter-default-rtdb.asia-southeast1.firebasedatabase.app/',projectId:'futari-meter',appId:''};
let db=null,auth=null,uid=null,dbApi=null,online=false,unsubscribe=null;
const $=id=>document.getElementById(id), today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Tokyo'}), stamp=()=>new Date().toISOString();
const base=()=>({boy:{score:80,name:'彼氏',avatar:'1',bubble:'だいすき♡'},girl:{score:80,name:'彼女',avatar:'1',bubble:'ごきげん♡'},anniversary:'',records:{},hugs:{},theme:{boy:'blue',girl:'pink'}});
let state=base(),room=localStorage.getItem('fm-room')||'',role=localStorage.getItem('fm-role')||'',page='home',filter='both',month=new Date().getMonth(),year=new Date().getFullYear(),selectedDay=0;
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const entries=()=>Object.entries(state.records||{}).map(([id,r])=>({...r,id})).sort((a,b)=>b.at.localeCompare(a.at));
const partner=()=>role==='boy'?'girl':'boy';
const nickname=r=>safe(state[r]?.name|| (r==='boy'?'彼氏':'彼女'));
const announce=msg=>{const t=$('toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2400)};
function openModal(html){$('dialog').innerHTML=html;$('modal').classList.remove('hidden')};function closeModal(){$('modal').classList.add('hidden')};$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});
function daysText(){if(!state.anniversary)return '';let start=new Date(state.anniversary+'T00:00:00+09:00');let now=new Date(today()+'T00:00:00+09:00');let d=Math.floor((now-start)/86400000)+1;return d>0?`付き合って ${d}日目 ♡`:''}
function render(){document.documentElement.style.setProperty('--bg','#ffeaf5');$('days').textContent=daysText();$('roomline').innerHTML=room?`ふたりのおへや ♡ <b>${safe(room)}</b>　${online?'🟢 つながってる':'🧸 おためしモード'}`:'ふたりのおへやは まだ未設定 ♡';renderHome();renderCalendar();renderRecords();renderSettings();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));['home','calendarPage','recordsPage','settingsPage'].forEach(p=>$(p).classList.toggle('hidden',p!==page))}
function chibiSvg(r,avatar,score){
  const stage=score>=100?6:score<20?0:score<40?1:score<60?2:score<80?3:score<95?4:5;
  const variant=([1,2,3].includes(Number(avatar))?Number(avatar):1);
  return `<img class="chibi portrait" src="characters/${r}-${variant}-${stage}.webp" alt="${r==='boy'?'彼氏':'彼女'}の表情" loading="eager" onerror="this.onerror=null;this.src='${r}-base.png'">`;
}
function renderHome(){const person=r=>{let p=state[r],score=Number(p.score)||0,editable=r===role;return `<div class="person ${r==='girl'?'girl':''}"><div class="name">${nickname(r)} ♡</div><div class="avatar">${chibiSvg(r,p.avatar,score)}</div><div class="meter" style="--accent:${r==='boy'?'#8fc7f2':'#f1a1c4'};--fill:${Math.max(0,Math.min(100,score))}%"><div><span class="number">${score}</span><span class="unit">${score>100?'あふれるきもち ♡':'きもちメーター'}</span></div></div><button class="bubble ${editable?'editable':''}" data-bubble="${r}" aria-label="${editable?'自分のひとことを編集':'相手のひとこと'}"><span class="btext">${safe(p.bubble||'ひとことをかいてね ♡')}</span>${editable?'<span class="editmark">✎</span>':''}</button></div>`};let sent=!!state.hugs?.[today()]?.[role];$('home').innerHTML=`<div class="couple">${person('boy')}${person('girl')}</div><div class="card"><div class="heading center">今日のきもちを伝える ♡</div><div class="two"><button class="mood" data-mood="plus">＋ うれしかった ♡</button><button class="mood minus" data-mood="minus">− かなしかった 🥺</button></div><button class="hug" id="hug" ${sent?'disabled':''}>${sent?'今日はぎゅー済み ♡':'🫂 ぎゅーをおくる ♡　相手に＋2'}</button><div class="muted center" style="margin-top:8px">ぎゅーは1日1回だけ ♡</div></div>`;document.querySelectorAll('[data-mood]').forEach(b=>b.onclick=()=>moodDialog(b.dataset.mood));document.querySelectorAll('[data-bubble]').forEach(b=>b.onclick=()=>{if(b.dataset.bubble===role)bubbleDialog();else announce('相手のひとことは変更できないよ ♡')});$('hug').onclick=sendHug;bindHearts()}
function bubbleDialog(){if(!role)return announce('先に役割を選んでね');openModal(`<h3>いまのきもち ♡</h3><p class="muted">吹き出しに表示するひとことをかいてね。点数は変わらないよ ♡</p><textarea id="bubbleText" class="field" maxlength="80" rows="3" placeholder="いまの気持ちをひとこと ♡">${safe(state[role].bubble||'')}</textarea><div class="muted" id="bubbleCount">${(state[role].bubble||'').length}/80文字</div><button class="primary" id="bubbleSave">ひとことを保存 ♡</button> <button class="secondary" id="bubbleCancel">やめる</button>`);$('bubbleCancel').onclick=closeModal;$('bubbleText').oninput=()=>{$('bubbleCount').textContent=$('bubbleText').value.length+'/80文字'};$('bubbleSave').onclick=async()=>{let v=$('bubbleText').value.trim();closeModal();await mutate(s=>{s[role].bubble=v});announce('ひとことを更新したよ ♡')}}
function recordHTML(r){let name=r.actor==='boy'?'💙 '+nickname('boy'):'🩷 '+nickname('girl');let v=Number(r.delta)||0;return `<div class="record"><div class="small">${name}　<span class="${r.actor==='boy'?'blue':'pink'}"><b>${v>0?'+':''}${v}</b></span>　${new Date(r.at).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div><p>${safe(r.text||'きもちを記録したよ ♡')}</p><button class="heart ${r.likes?.[role]?'liked':''}" data-like="${safe(r.id)}">♡ ${Object.keys(r.likes||{}).length||''}</button></div>`}
function bindHearts(){document.querySelectorAll('[data-like]').forEach(b=>b.onclick=()=>toggleLike(b.dataset.like))}
function moodDialog(kind){openModal(`<h3>${kind==='plus'?'うれしかった ♡':'かなしかった 🥺'}</h3><label>点数：<b id="pointLabel">10</b> 点</label><input id="points" class="field" type="range" min="1" max="30" value="10" oninput="document.getElementById('pointLabel').textContent=this.value"><label>どんなことがあった？（任意）</label><textarea class="field" id="note" rows="3" maxlength="250" placeholder="今日の気持ちをひとこと ♡"></textarea><button class="primary" id="saveMood">きもちを残す ♡</button> <button class="secondary" id="cancel">やめる</button>`);$('cancel').onclick=closeModal;$('saveMood').onclick=async()=>{let n=Number($('points').value)*(kind==='plus'?1:-1),note=$('note').value.trim();closeModal();await mutate(s=>{s[role].score=Math.max(0,(Number(s[role].score)||0)+n);s.records[crypto.randomUUID()]={actor:role,delta:n,text:note,at:stamp(),likes:{}}});announce('きもちを記録したよ ♡')}}
async function sendHug(){if(!role)return announce('先に役割を選んでね');let mutual=false,done=false;await mutate(s=>{s.hugs ||= {};s.hugs[today()] ||= {};if(s.hugs[today()][role])return;done=true;s.hugs[today()][role]=true;s[partner()].score=(Number(s[partner()].score)||0)+2;s.records[crypto.randomUUID()]={actor:role,delta:2,text:`${role==='boy'?'彼氏':'彼女'}からぎゅーが届いたよ ♡`,at:stamp(),likes:{},type:'hug',recipient:partner()};mutual=!!s.hugs[today()][partner()]});if(done){announce('ぎゅーを送ったよ ♡');if(mutual)hearts()}else announce('今日はもうぎゅーしたよ ♡')}
function hearts(){for(let i=0;i<14;i++){let el=document.createElement('span');el.className='floatheart';el.textContent=i%2?'💗':'♡';el.style.left=(12+Math.random()*76)+'%';el.style.animationDelay=(Math.random()*.5)+'s';document.body.append(el);setTimeout(()=>el.remove(),3300)}}
async function toggleLike(id){await mutate(s=>{let r=s.records[id];if(!r)return;r.likes||={};if(r.likes[role])delete r.likes[role];else r.likes[role]=true})}
function renderCalendar(){
 const localDay=at=>{const d=new Date(at);return {year:d.getFullYear(),month:d.getMonth(),day:d.getDate()}};
 const all=entries().filter(r=>{const d=localDay(r.at);return d.year===year&&d.month===month});
 const first=new Date(year,month,1).getDay(),last=new Date(year,month+1,0).getDate();
 const current=new Date(),isCurrent=current.getFullYear()===year&&current.getMonth()===month;
 let cells=['日','月','火','水','木','金','土'].map(w=>`<div class="cal-week">${w}</div>`).join('');
 for(let i=0;i<first;i++)cells+='<div></div>';
 for(let d=1;d<=last;d++){
  const records=all.filter(r=>localDay(r.at).day===d);
  const sum=who=>records.filter(x=>x.actor===who).reduce((n,x)=>n+Number(x.delta||0),0);
  const has=who=>records.some(r=>r.actor===who),b=sum('boy'),g=sum('girl');
  cells+=`<button class="calcell ${selectedDay===d?'selected':''} ${isCurrent&&current.getDate()===d?'today':''}" data-day="${d}" aria-label="${month+1}月${d}日"><span class="date">${d}</span>${filter!=='girl'&&has('boy')?`<span class="tiny blue">${b>0?'+':''}${b}</span>`:''}${filter!=='boy'&&has('girl')?`<span class="tiny pink">${g>0?'+':''}${g}</span>`:''}${!records.length?'':filter==='both'&&!has('boy')&&!has('girl')?'<span class="dot">♡</span>':''}</button>`;
 }
 const visible=all.filter(r=>filter==='both'||r.actor===filter);
 const stats=who=>all.filter(r=>r.actor===who).reduce((n,r)=>n+Number(r.delta||0),0);
 const b=stats('boy'),g=stats('girl');
 const details=selectedDay?visible.filter(r=>localDay(r.at).day===selectedDay):[];
 const count=who=>all.filter(r=>r.actor===who).length;
 $('calendarPage').innerHTML=`<div class="card"><div class="heading center">📅 ふたりのカレンダー ♡</div><div class="cal-top"><button class="cal-arrow" id="prev" aria-label="前の月">‹</button><div class="cal-title">${year}年 ${month+1}月 ♡</div><button class="cal-arrow" id="next" aria-label="次の月">›</button></div><div class="switch">${[['both','💕 ふたり'],['boy','🩵 彼氏'],['girl','🩷 彼女']].map(([v,l])=>`<button data-filter="${v}" class="${filter===v?'on':''}">${l}</button>`).join('')}</div><div class="calendar">${cells}</div><div class="cal-note">🩵 彼氏の変化　🩷 彼女の変化<br>日付をタップすると、その日の思い出が見られるよ ♡</div>${selectedDay?`<div class="cal-detail"><div class="heading">${month+1}月${selectedDay}日のきもち ♡</div>${details.map(recordHTML).join('')||'<p class="muted">この日の記録はまだないよ ♡</p>'}</div>`:''}</div><div class="card"><div class="heading center">💕 ${month+1}月のきもちレポート</div><div class="cal-summary"><div class="cal-sum boy">🩵 ${nickname('boy')}<strong>${b>0?'+':''}${b}</strong><span>${count('boy')}件のきろく</span></div><div class="cal-sum girl">🩷 ${nickname('girl')}<strong>${g>0?'+':''}${g}</strong><span>${count('girl')}件のきろく</span></div></div><div class="cal-total">ふたりの合計<strong>${b+g>0?'+':''}${b+g} ♡</strong><span class="muted">今月のきろく ${all.length}件</span></div></div>`;
 $('prev').onclick=()=>{month--;if(month<0){month=11;year--}selectedDay=0;render()};
 $('next').onclick=()=>{month++;if(month>11){month=0;year++}selectedDay=0;render()};
 document.querySelectorAll('#calendarPage [data-filter]').forEach(el=>el.onclick=()=>{filter=el.dataset.filter;render()});
 document.querySelectorAll('#calendarPage [data-day]').forEach(el=>el.onclick=()=>{selectedDay=Number(el.dataset.day);render()});
 bindHearts();
}
function renderRecords(){$('recordsPage').innerHTML=`<div class="card"><div class="records-sticky"><div class="heading">きろく（きもちの履歴）♡</div><div class="switch">${[['both','💕 ふたり'],['boy','💙 彼氏'],['girl','🩷 彼女']].map(([v,l])=>`<button data-filter="${v}" class="${filter===v?'on':''}">${l}</button>`).join('')}</div></div>${entries().filter(r=>filter==='both'||r.actor===filter).map(recordHTML).join('')||'<p class="muted">まだ記録がないよ ♡</p>'}</div>`;document.querySelectorAll('#recordsPage [data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});bindHearts()}
function renderSettings(){$('settingsPage').innerHTML=`<div class="card"><div class="heading">⚙ ふたりの設定 ♡</div><p class="settings-intro">ふたりらしいおへやにしよう ♡</p><div class="settings-row"><b>👤 あなたは ${role==='boy'?'💙 彼氏':role==='girl'?'🩷 彼女':'未設定'}</b><p class="muted">自分の名前とキャラクターを選べるよ</p><button class="secondary" id="profile">プロフィールを変える</button></div><div class="settings-row"><b>📅 付き合い始めた日 ♡</b><input class="field" id="anniversary" type="date" value="${safe(state.anniversary)}"><button class="secondary" id="saveAnniversary">日付を保存</button></div><div class="settings-row"><b>🏠 ふたりのおへや</b><p class="muted">おへやの合言葉：${safe(room||'未設定')}</p><button class="secondary" id="changeRoom">おへや・役割を変更</button></div><div class="settings-row"><b>💌 きろくのバックアップ</b><p class="muted">JSONファイルに保存できるよ</p><button class="secondary" id="export">書き出す</button></div><div class="settings-row"><b>🔄 自分のメーターをリセット</b><p class="muted">自分だけ80点に戻すよ。履歴は残るよ</p><button class="secondary" id="reset">リセットする</button></div><div class="settings-row"><b>🗑 ふたりの記録をすべて削除</b><p class="muted">ふたりの承認が必要。安全な承認機能は準備中だよ</p><button class="secondary" disabled>準備中</button></div><p class="muted">🔔 プッシュ通知・自動バックアップは、Firebase連携と送信設定を整えてから追加するよ。</p></div>`;$('profile').onclick=profileDialog;$('changeRoom').onclick=setupDialog;$('saveAnniversary').onclick=async()=>{let date=$('anniversary').value;await mutate(s=>{s.anniversary=date});announce('記念日を保存したよ ♡')};$('export').onclick=()=>{let blob=new Blob([JSON.stringify({exportedAt:stamp(),room,data:state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='futari-meter-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('reset').onclick=()=>{if(!confirm('自分のメーターを80点に戻す？ 記録は残るよ。'))return;mutate(s=>{s[role].score=80;s.records[crypto.randomUUID()]={actor:role,delta:0,text:'メーターを80点にリセットしたよ ♡',at:stamp(),likes:{},type:'reset'}})}}
function profileDialog(){openModal(`<h3>じぶんのプロフィール ♡</h3><label>おなまえ</label><input class="field" id="pname" maxlength="18" value="${nickname(role)}"><label>キャラクター</label><select class="field" id="pavatar">${[1,2,3].map(a=>`<option value="${a}" ${String(state[role].avatar)===String(a)?'selected':''}>${role==='boy'?['','黒髪マッシュ','茶髪センター分け','明るい茶髪'][a]:['','お団子ヘア','黒髪ロング','茶髪ボブ'][a]}</option>`).join('')}</select><div class="character-preview" id="characterPreview"></div><label>ひとこと</label><input class="field" id="pbubble" maxlength="32" value="${safe(state[role].bubble)}"><button class="primary" id="psave">保存する ♡</button>`);const updatePreview=()=>{const a=Number($('pavatar').value)||1;const score=Number(state[role].score)||0;const st=score>=100?6:score<20?0:score<40?1:score<60?2:score<80?3:score<95?4:5;$('characterPreview').innerHTML=`<img src="characters/${role}-${a}-${st}.webp" alt="キャラクタープレビュー"><span>いまの点数：${score}点 ♡</span>`};$('pavatar').onchange=updatePreview;updatePreview();$('psave').onclick=async()=>{let n=$('pname').value.trim(),a=$('pavatar').value,b=$('pbubble').value.trim();closeModal();await mutate(s=>{s[role].name=n||s[role].name;s[role].avatar=a;s[role].bubble=b});announce('プロフィールを保存したよ ♡')}}
function setupDialog(){openModal(`<h3>ふたりのおへや ♡</h3><p class="muted">ふたりで同じ合言葉を使ってね。自分の役割も選ぼう！</p><label>合言葉（英数字）</label><input class="field" id="roomInput" maxlength="24" value="${safe(room)}" placeholder="例：LOVE2026"><label>あなたは？</label><select class="field" id="roleInput"><option value="boy" ${role==='boy'?'selected':''}>💙 彼氏</option><option value="girl" ${role==='girl'?'selected':''}>🩷 彼女</option></select><button class="primary" id="join">このおへやに入る ♡</button><p class="muted">※ 体験モードではこの端末に保存。Firebase設定後はふたりで共有できるよ。</p>`);$('join').onclick=async()=>{let v=$('roomInput').value.trim().toUpperCase();if(!/^[A-Z0-9_-]{4,24}$/.test(v)){announce('合言葉は英数字4〜24文字にしてね');return}room=v;role=$('roleInput').value;localStorage.setItem('fm-room',room);localStorage.setItem('fm-role',role);closeModal();await subscribe();render()}}
async function mutate(fn){if(online&&dbApi&&db){try{let ref=dbApi.ref(db,'rooms/'+room);await dbApi.runTransaction(ref,old=>{let s=old||base();s.boy||=base().boy;s.girl||=base().girl;s.records||={};s.hugs||={};fn(s);return s});return}catch(e){announce('保存に失敗したよ。通信を確認してね');console.error(e);return}}fn(state);localStorage.setItem('fm-demo-'+room,JSON.stringify(state));render()}
async function subscribe(){if(unsubscribe){unsubscribe();unsubscribe=null}online=false;if(!room||!role){state=base();render();return}if(db&&dbApi&&uid){unsubscribe=dbApi.onValue(dbApi.ref(db,'rooms/'+room),snap=>{state=snap.val()||base();online=true;render()},e=>{console.error(e);online=false;announce('Firebaseの読み込みに失敗したよ');render()});return}try{state=JSON.parse(localStorage.getItem('fm-demo-'+room)||'null')||base()}catch{state=base()}render()}
async function initFirebase(){if(!firebaseConfig.apiKey||!firebaseConfig.appId)return;try{const appMod=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js'),authMod=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js');dbApi=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js');let app=appMod.initializeApp(firebaseConfig);auth=authMod.getAuth(app);await authMod.signInAnonymously(auth);uid=auth.currentUser?.uid;db=dbApi.getDatabase(app);await subscribe()}catch(e){console.error(e);announce('Firebaseに接続できず体験モードで起動したよ')}}
$('nav').onclick=e=>{let b=e.target.closest('[data-page]');if(!b)return;page=b.dataset.page;render();window.scrollTo(0,0)};$('menu').onclick=()=>{page='settingsPage';render()};$('bell').onclick=()=>announce('通知はこれから実装するよ ♡');await subscribe();await initFirebase();if(!room||!role)setupDialog();
</script></body></html>
